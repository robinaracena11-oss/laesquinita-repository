<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Esquinita | Menú Oficial 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        
        /* Animaciones suaves */
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Ajustes de scroll táctil */
        .snap-x-mandatory { scroll-snap-type: x mandatory; }
        .snap-start { scroll-snap-align: start; }

        /* Estilo de los inputs en iOS para evitar zoom automático */
        input[type="text"], textarea { font-size: 16px !important; }

        .ai-shimmer {
            background: linear-gradient(90deg, #f3f4f6 25%, #fbbf24 50%, #f3f4f6 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="antialiased text-slate-900 overflow-x-hidden">

    <!-- Navegación Móvil Optimizada -->
    <nav class="fixed top-0 w-full z-50 glass-nav border-b border-slate-100 h-16 md:h-20">
        <div class="max-w-6xl mx-auto px-4 h-full flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer group" onclick="location.reload()">
                <img src="logotipo.png" onerror="this.style.display='none'" class="h-10 w-auto object-contain" alt="Logo">
                <span class="font-black text-xl md:text-2xl tracking-tighter">LA ESQUINITA</span>
            </div>
            
            <button onclick="toggleCart()" class="relative p-2.5 bg-slate-50 rounded-xl border border-slate-100 shadow-sm active:scale-90 transition-transform">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                </svg>
                <span id="cart-count" class="absolute -top-1 -right-1 bg-amber-600 text-white text-[10px] font-bold h-5 w-5 flex items-center justify-center rounded-full border-2 border-white">0</span>
            </button>
        </div>
    </nav>

    <!-- Header Adaptado -->
    <header class="pt-24 md:pt-40 pb-6 px-4 text-center max-w-4xl mx-auto">
        <span class="text-amber-600 font-bold uppercase text-[9px] tracking-[0.3em] mb-2 block italic">Las Colinas, Santiago</span>
        <h1 class="text-4xl md:text-7xl font-black mb-4 uppercase tracking-tighter text-slate-950 leading-tight">Menú <span class="italic text-amber-600">Oficial</span></h1>
        
        <button onclick="getAIRecommendation()" class="mb-6 inline-flex items-center gap-2 bg-gradient-to-r from-amber-500 to-orange-600 text-white px-5 py-2.5 rounded-full font-bold text-[10px] uppercase tracking-widest shadow-lg active:scale-95 transition-all">
            <span>✨ Recomendación IA</span>
        </button>

        <div id="ai-suggestion-box" class="hidden mb-6 p-5 bg-white border border-amber-100 rounded-3xl shadow-sm max-w-lg mx-auto text-xs md:text-sm text-slate-600 italic relative overflow-hidden">
            <div id="ai-loading" class="absolute inset-0 ai-shimmer opacity-10 hidden"></div>
            <p id="ai-text" class="relative z-10 leading-relaxed"></p>
        </div>

        <div class="relative max-w-md mx-auto px-2">
            <input type="text" id="menu-search" oninput="searchMenu()" placeholder="¿Qué deseas comer hoy?..." class="w-full px-5 py-3.5 rounded-2xl border border-slate-200 shadow-sm focus:ring-2 focus:ring-amber-500 outline-none transition-all placeholder:text-slate-400">
        </div>
    </header>

    <!-- Categorías con Scroll Horizontal Táctil -->
    <div class="sticky top-16 md:top-20 z-40 glass-nav border-b border-slate-100 overflow-x-auto no-scrollbar snap-x-mandatory">
        <div class="flex gap-2 px-4 py-3.5 max-w-6xl mx-auto items-center" id="category-pills"></div>
    </div>

    <!-- Grid de Items Optimizado para Pulgares -->
    <main class="max-w-6xl mx-auto px-4 py-8">
        <div id="items-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8"></div>
    </main>

    <!-- Barra de Resumen Móvil (Sticky Bottom) -->
    <div id="cart-bar" class="fixed bottom-6 left-0 right-0 px-4 translate-y-40 transition-transform duration-500 z-50">
        <div class="max-w-md mx-auto bg-slate-900 text-white p-4 rounded-[2rem] flex items-center justify-between shadow-2xl border border-white/10">
            <div class="pl-3">
                <p class="text-[9px] uppercase tracking-widest text-slate-400 font-bold">Total</p>
                <p id="total-price" class="text-xl font-black text-amber-500 leading-none mt-0.5">$0</p>
            </div>
            <button onclick="toggleCart()" class="bg-amber-600 px-6 py-3.5 rounded-2xl font-bold text-[10px] uppercase tracking-widest active:scale-95 transition-all shadow-lg">Ver Mi Orden</button>
        </div>
    </div>

    <!-- Modal del Carrito (Pantalla Completa en Móvil) -->
    <div id="cart-modal" class="fixed inset-0 bg-white z-[100] translate-y-full transition-transform duration-500 flex flex-col">
        <header class="p-6 border-b flex justify-between items-center bg-slate-50 shrink-0">
            <div>
                <h2 class="text-2xl font-black uppercase tracking-tighter">Mi Pedido</h2>
                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest mt-0.5">Personaliza tu orden</p>
            </div>
            <button onclick="toggleCart()" class="text-3xl font-light p-2 active:bg-slate-200 rounded-full transition-colors">&times;</button>
        </header>
        
        <div id="cart-items" class="flex-grow overflow-y-auto p-4 space-y-4 bg-white"></div>

        <!-- Maridaje IA -->
        <div id="pairing-section" class="hidden p-4 bg-amber-50 mx-4 rounded-2xl border border-amber-100 flex flex-col gap-1 mb-4">
            <div class="flex items-center gap-2 text-amber-800 font-bold text-[9px] uppercase tracking-widest">
                <span class="bg-amber-200 px-2 py-0.5 rounded-md">✨ Chef IA</span>
            </div>
            <p id="pairing-text" class="text-[11px] text-amber-900 italic leading-snug"></p>
        </div>

        <div class="p-6 border-t bg-white shrink-0">
            <div class="flex justify-between items-center mb-6 px-1">
                <div>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Total</p>
                    <span id="final-total" class="font-black text-3xl text-slate-950">$0</span>
                </div>
                <button onclick="getAIPairing()" id="btn-pairing" class="text-[9px] font-bold uppercase tracking-widest text-amber-600 border border-amber-200 px-3 py-2 rounded-full active:bg-amber-50 transition-colors">
                    ✨ ¿Algo más?
                </button>
            </div>
            <button onclick="sendToWhatsapp()" class="w-full bg-green-600 text-white py-5 rounded-2xl font-bold uppercase tracking-widest shadow-xl text-[11px] active:scale-95 transition-all flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.246 2.248 3.484 5.232 3.484 8.412 0 6.556-5.338 11.892-11.893 11.892-1.997-.001-3.951-.5-5.688-1.448l-6.309 1.656zm6.29-4.113l.354.21c1.426.848 3.066 1.296 4.743 1.297 5.207 0 9.447-4.24 9.447-9.446 0-2.522-.982-4.893-2.765-6.678-1.783-1.784-4.155-2.766-6.677-2.766-5.207 0-9.447 4.241-9.447 9.448 0 1.777.498 3.51 1.441 5.01l.231.365-1.085 3.961 4.058-1.065z"/></svg>
                Confirmar WhatsApp
            </button>
        </div>
    </div>

    <!-- Lightbox de Imagen (Optimizado) -->
    <div id="lightbox" class="fixed inset-0 z-[200] bg-slate-950/95 hidden backdrop-blur-md flex flex-col items-center justify-center p-4 transition-opacity duration-300" onclick="closeLightbox()">
        <button class="absolute top-6 right-6 text-white text-4xl font-light active:bg-white/10 rounded-full h-12 w-12 flex items-center justify-center transition-all">&times;</button>
        <div class="w-full flex flex-col items-center gap-6" onclick="event.stopPropagation()">
            <img id="lightbox-img" src="" class="max-h-[70vh] max-w-full rounded-2xl shadow-2xl object-contain border border-white/10" alt="Plato">
            <div class="text-center">
                <h3 id="lightbox-title" class="text-white text-2xl font-black uppercase tracking-tighter mb-2"></h3>
                <button onclick="addFromLightbox()" class="bg-amber-600 text-white px-8 py-3 rounded-xl font-bold uppercase text-[10px] tracking-widest shadow-xl active:scale-95 transition-all">Agregar ahora</button>
            </div>
        </div>
    </div>

    <script>
        const apiKey = ""; 
        const placeholderImg = "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500&q=80";

        // Mantenemos la base de datos completa de antes
        const menuData = [
            // DESAYUNOS
            { id: 1, cat: "Desayunos", n: "Tres Golpes", p: 175, d: "Mangú encebollado, huevo, salami y queso frito.", img: "Tres Golpes.jpg" },
            { id: 2, cat: "Desayunos", n: "Puré de Papas y Huevos", p: 175, d: "Cremoso puré, mozzarella y huevos revueltos.", img: "Puré de Papas y Huevos.jpg" },
            { id: 3, cat: "Desayunos", n: "Frito con Salami", p: 150, d: "Clásico dominicano: fritos con salami.", img: "Frito con Salami.jpg" },
            { id: 4, cat: "Desayunos", n: "Huevos y tocino", p: 200, d: "Huevos, tocineta, aguacate y rodaja de pan.", img: "Huevos y tocino.jpg" },
            { id: 5, cat: "Desayunos", n: "Huevos y Pancakes", p: 190, d: "Pancakes, sirop, huevo y salchichas de desayuno.", img: "Huevos y Pancakes.jpg" },
            { id: 6, cat: "Desayunos", n: "Tostadas francesas", p: 195, d: "Pan brioche, mezcla francesa, salchichitas y huevos cremosos.", img: "Tostadas francesas.jpg" },
            { id: 7, cat: "Desayunos", n: "Omelette", p: 135, d: "Tortilla de huevo, jamón, queso, ají y cebollas salteadas.", img: "Omelette.jpg" },
            { id: 10, cat: "Desayunos", n: "Full Americano", p: 250, d: "Papas salteadas, Pancakes, sirop, huevo y salchichas.", img: "Full Americano.jpg" },

            // SANDWICHES
            { id: 11, cat: "Sandwiches", n: "Sandwich de pierna", p: 175, d: "Pan baguete, pierna ahumada, pimiento, cebolla, salsa china, lechuga, tomate y tártara.", img: "Sandwich de pierna.jpg" },
            { id: 16, cat: "Sandwiches", n: "Sandwich Philly cheese steak", p: 395, d: "Filete Angus derretido de queso premium.", img: "Sandwich Philly cheese steak.jpg" },

            // HAMBURGUESAS
            { id: 25, cat: "Hamburguesas", n: "Baconcheeseburguer", p: 250, d: "Pan brioche, res, bacon y queso mozzarella con papas.", img: "Baconcheeseburguer.jpg" },
            { id: 29, cat: "Hamburguesas", n: "Luxury", p: 475, d: "Carne res, tocineta, cheddar, aros de cebolla, huevo y tártara.", img: "Luxury.jpg" },

            // CARNES
            { id: 52, cat: "Carnes", n: "Picaña", p: 975, d: "Corte premium a la parrilla con guarnición.", img: "Picaña.jpg" },
            { id: 54, cat: "Carnes", n: "CHURRASCO", p: 1150, d: "Filete angus premium con puré de papa.", img: "CHURRASCO.jpg" },

            // PASTAS
            { id: 58, cat: "Pastas", n: "Carbonara", p: 395, d: "Linguini, yemas de huevo, panceta de cerdo y parmesano.", img: "Carbonara.jpg" },
            { id: 61, cat: "Pastas", n: "Blanca con camarones", p: 550, d: "Salsa especial de queso con camarones salteados.", img: "Blanca con camarones.jpg" },

            // BEBIDAS
            { id: 82, cat: "Bebidas", n: "Café Negro", p: 25, d: "Tostado local puro.", img: "Café Negro.jpg" },
            { id: 88, cat: "Bebidas", n: "Morisoñado chinola", p: 150, d: "Clásico dominicano refrescante.", img: "Morisoñado chinola.jpg" }
        ];

        let cart = {}; 
        let currentCat = "Todos";
        let currentLightboxId = null;
        const cats = ["Todos", "Desayunos", "Sandwiches", "Hamburguesas", "Carnes", "Pastas", "Bebidas"];

        // --- GEMINI API ---
        async function callGemini(prompt, systemInstruction = "") {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: systemInstruction }] }
            };

            for (let i = 0; i < 5; i++) {
                try {
                    const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (!response.ok) throw new Error();
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text;
                } catch (e) { await new Promise(r => setTimeout(r, Math.pow(2, i) * 1000)); }
            }
            return "Chef ocupado. Reintenta pronto.";
        }

        async function getAIRecommendation() {
            const box = document.getElementById('ai-suggestion-box');
            const text = document.getElementById('ai-text');
            const loader = document.getElementById('ai-loading');
            box.classList.remove('hidden');
            loader.classList.remove('hidden');
            text.innerText = "Consultando al Chef...";
            const menuList = menuData.map(i => i.n).join(", ");
            const result = await callGemini(`Sugiere un plato de: ${menuList}. 1 frase corta apetitosa.`, "Sommelier dominicano experto.");
            text.innerText = result;
            loader.classList.add('hidden');
        }

        async function getAIPairing() {
            const cartItems = Object.values(cart);
            if (cartItems.length === 0) return;
            const pairingSection = document.getElementById('pairing-section');
            const pairingText = document.getElementById('pairing-text');
            pairingSection.classList.remove('hidden');
            pairingText.innerText = "Pensando...";
            const order = cartItems.map(i => i.n).join(", ");
            const result = await callGemini(`El cliente ordenó ${order}. Sugiere una bebida o guarnición del menú (Café, Morisoñado, Tostones, Puré) para acompañar. Explica por qué brevemente.`, "Chef experto.");
            pairingText.innerText = result;
        }

        // --- UI LOGIC ---
        function renderUI() {
            document.getElementById('category-pills').innerHTML = cats.map(c => `
                <button onclick="filter('${c}')" class="shrink-0 snap-start px-5 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest border transition-all ${currentCat === c ? 'bg-slate-900 text-white border-slate-900 shadow-md' : 'bg-white text-slate-400 border-slate-100'}">${c}</button>
            `).join('');
            const filtered = currentCat === "Todos" ? menuData : menuData.filter(i => i.cat === currentCat);
            renderGrid(filtered);
        }

        function renderGrid(items) {
            document.getElementById('items-grid').innerHTML = items.map(i => `
                <div class="bg-white rounded-3xl overflow-hidden border border-slate-100 shadow-sm fade-in flex flex-col">
                    <div class="h-56 relative overflow-hidden active:opacity-90 transition-opacity" onclick="openLightbox(${i.id}, '${i.img}', '${i.n}')">
                        <img src="${i.img}" onerror="this.onerror=null;this.src='${placeholderImg}';" class="w-full h-full object-cover" alt="${i.n}">
                        <div class="absolute top-3 right-3 bg-white/95 px-3 py-1.5 rounded-xl font-black text-amber-600 shadow-sm text-sm">$${i.p}</div>
                    </div>
                    <div class="p-6 flex-grow flex flex-col">
                        <h3 class="font-black text-lg uppercase tracking-tighter mb-1">${i.n}</h3>
                        <p class="text-slate-400 text-[11px] mb-6 leading-relaxed line-clamp-2">${i.d}</p>
                        <button onclick="addToCart(${i.id})" class="mt-auto w-full bg-slate-900 text-white py-4 rounded-xl font-bold text-[10px] uppercase tracking-widest active:bg-amber-600 active:scale-[0.98] transition-all">Agregar</button>
                    </div>
                </div>
            `).join('');
        }

        function searchMenu() {
            const query = document.getElementById('menu-search').value.toLowerCase();
            const filtered = menuData.filter(i => i.n.toLowerCase().includes(query));
            renderGrid(filtered);
        }

        function filter(c) { currentCat = c; renderUI(); }

        function addToCart(id) {
            if (cart[id]) cart[id].qty += 1;
            else cart[id] = { ...menuData.find(i => i.id === id), qty: 1, note: "" };
            
            const counter = document.getElementById('cart-count');
            counter.classList.add('cart-bump');
            setTimeout(() => counter.classList.remove('cart-bump'), 300);
            updateCartUI();
        }

        function removeFromCart(id) {
            if (cart[id]) {
                if (cart[id].qty > 1) cart[id].qty -= 1;
                else delete cart[id];
            }
            updateCartUI();
        }

        function updateCartUI() {
            const cartArray = Object.values(cart);
            const totalCount = cartArray.reduce((acc, i) => acc + i.qty, 0);
            const totalPrice = cartArray.reduce((acc, i) => acc + (i.p * i.qty), 0);
            document.getElementById('cart-count').innerText = totalCount;
            document.getElementById('total-price').innerText = `$${totalPrice}`;
            document.getElementById('final-total').innerText = `$${totalPrice}`;
            document.getElementById('cart-bar').classList.toggle('translate-y-40', totalCount === 0);

            if (totalCount === 0) {
                document.getElementById('cart-items').innerHTML = `<p class="text-center text-slate-300 py-20 text-xs font-bold uppercase tracking-widest">Carrito Vacío</p>`;
            } else {
                document.getElementById('cart-items').innerHTML = cartArray.map(i => `
                    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                        <div class="flex justify-between items-center mb-3">
                            <div class="flex items-center gap-3">
                                <span class="bg-amber-600 text-white w-8 h-8 rounded-lg flex items-center justify-center font-black text-xs">${i.qty}</span>
                                <h4 class="font-black text-xs uppercase">${i.n}</h4>
                            </div>
                            <div class="flex gap-1.5">
                                <button onclick="removeFromCart(${i.id})" class="w-8 h-8 bg-white rounded-lg flex items-center justify-center border font-bold text-slate-400 active:bg-slate-100">-</button>
                                <button onclick="addToCart(${i.id})" class="w-8 h-8 bg-white rounded-lg flex items-center justify-center border font-bold text-slate-400 active:bg-slate-100">+</button>
                            </div>
                        </div>
                        <textarea oninput="cart[${i.id}].note=this.value" placeholder="Notas (ej. sin cebolla)" class="w-full bg-white border border-slate-200 rounded-lg p-2.5 text-[11px] outline-none h-12">${i.note}</textarea>
                    </div>
                `).join('');
            }
        }

        function toggleCart() { document.getElementById('cart-modal').classList.toggle('translate-y-full'); }

        function sendToWhatsapp() {
            const cartArray = Object.values(cart);
            if (!cartArray.length) return;
            let message = "*¡Pedido La Esquinita!*%0A%0A";
            cartArray.forEach(i => {
                message += `✅ *${i.qty}x ${i.n}*%0A`;
                if (i.note) message += `   _Nota: ${i.note}_%0A`;
            });
            const total = cartArray.reduce((acc, i) => acc + (i.p * i.qty), 0);
            message += `%0A*TOTAL: $${total}*`;
            window.open(`https://wa.me/18297847674?text=${message}`, '_blank');
        }

        // --- LIGHTBOX ---
        function openLightbox(id, src, title) {
            currentLightboxId = id;
            const lb = document.getElementById('lightbox');
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox-title').innerText = title;
            lb.classList.remove('hidden');
            lb.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function addFromLightbox() {
            if(currentLightboxId) addToCart(currentLightboxId);
            closeLightbox();
        }

        renderUI();
        updateCartUI();
    </script>
</body>
</html>
